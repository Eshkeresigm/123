name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NDK_VERSION: "26.1.10909125"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK platform, build-tools and NDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then SDKM="$(command -v sdkmanager)"; fi
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "ndk;${NDK_VERSION}"

      - name: Go checks for the phone core
        run: |
          go vet ./mobile
          go test ./mobile

      - name: Build the Go core (gomobile bind)
        run: |
          set +e
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/${NDK_VERSION}"
          export PATH="$PATH:$(go env GOPATH)/bin"
          {
            set -x
            ls "$ANDROID_NDK_HOME" | head -3
            go install golang.org/x/mobile/cmd/gomobile@latest &&
            go install golang.org/x/mobile/cmd/gobind@latest &&
            go get golang.org/x/mobile/bind@latest &&
            gomobile init &&
            mkdir -p android/app/libs &&
            gomobile bind -target=android/arm64,android/arm -androidapi 24 -trimpath -ldflags="-s -w" \
              -o android/app/libs/cvmobile.aar ./mobile &&
            unzip -p android/app/libs/cvmobile.aar classes.jar > /tmp/classes.jar &&
            unzip -Z1 /tmp/classes.jar | grep -v '^META' > classes.txt
          } > bind.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::error title=gomobile bind failed::$(tail -c 3500 bind.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"
            exit $rc
          fi
          cat bind.log
          echo "::notice title=classes::$(head -c 3000 classes.txt | sed ':a;N;$!ba;s/\n/%0A/g')"
          grep -q 'cvmobile/Session.class' classes.txt

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build the APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ChessVision.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ChessVision-apk
          path: ChessVision.apk
          if-no-files-found: error
