name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NDK_VERSION: "26.1.10909125"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install SDK platform, build-tools and NDK
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;${NDK_VERSION}"

      - name: Go checks for the phone core
        run: |
          go vet ./mobile
          go test ./mobile

      - name: Build the Go core (gomobile bind)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/${NDK_VERSION}"
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          go get golang.org/x/mobile/bind@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
          gomobile init
          mkdir -p android/app/libs
          gomobile bind -target=android/arm64,android/arm -androidapi 24 -trimpath -ldflags="-s -w" \
            -o android/app/libs/cvmobile.aar ./mobile
          unzip -l android/app/libs/cvmobile.aar
          unzip -p android/app/libs/cvmobile.aar classes.jar > /tmp/classes.jar
          unzip -l /tmp/classes.jar | grep -E "go/cvmobile/(Cvmobile|Session|Host)\.class"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build the APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ChessVision.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ChessVision-apk
          path: ChessVision.apk
          if-no-files-found: error
