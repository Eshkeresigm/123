name: build-provpn-exe

on:
  workflow_dispatch: {}
  push:
    branches: [provpn-exe]
    paths: ['provpn/**', '.github/workflows/build-provpn-exe.yml']

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: provpn
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax check
        run: |
          node --check main.js
          node --check server.js
          node --check public/app.js

      - name: Build desktop exe
        run: npm run build:win

      - name: Locate exe
        run: |
          if (-not (Test-Path dist\ProVpn.exe)) { throw 'dist\ProVpn.exe missing' }

      - name: Smoke-test the desktop app
        run: ./test/ci-smoke.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: ProVpn-win-x64
          path: provpn/dist/ProVpn.exe
          if-no-files-found: error
