<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ProVpn</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>

<main class="app">
  <header class="top">
    <div class="brand">
      <img src="logo.svg" alt="" width="40" height="40">
      <span>Pro<b>Vpn</b></span>
    </div>
    <div class="pill" id="pill"><span class="dot"></span><span id="pillText">Не защищён</span></div>
  </header>

  <section class="hero">
    <div class="orb" id="orb">
      <svg viewBox="0 0 320 320" class="rings" aria-hidden="true">
        <defs>
          <linearGradient id="ringG" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="var(--c1)"/><stop offset="1" stop-color="var(--c2)"/>
          </linearGradient>
        </defs>
        <circle class="ring r1" cx="160" cy="160" r="150"/>
        <circle class="ring r2" cx="160" cy="160" r="128"/>
        <circle class="ring r3" cx="160" cy="160" r="106"/>
      </svg>
      <button class="power" id="power" aria-label="Подключить или отключить">
        <svg viewBox="0 0 48 48" width="64" height="64" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round">
          <path d="M24 6v17"/><path d="M14 11.5a16 16 0 1 0 20 0"/>
        </svg>
      </button>
    </div>
    <h1 id="title">Нажмите для подключения</h1>
    <p class="sub" id="sub">Выберите профиль ниже</p>
  </section>

  <section class="stats">
    <div class="card"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg><div><small>Отправлено</small><b id="tx">0 Б</b></div></div>
    <div class="card"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7 7-7"/></svg><div><small>Получено</small><b id="rx">0 Б</b></div></div>
    <div class="card"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><div><small>Рукопожатие</small><b id="hs">—</b></div></div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2>Профили</h2>
      <button class="ghost" id="addBtn">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> Добавить
      </button>
    </div>
    <ul class="list" id="list"></ul>
    <p class="empty" id="empty" hidden>
      <svg viewBox="0 0 64 64" width="72" height="72" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="32" cy="32" r="24"/><ellipse cx="32" cy="32" rx="10" ry="24"/><path d="M8 32h48M12 20h40M12 44h40"/></svg>
      Профилей пока нет. Добавьте WireGuard-конфиг вашего сервера.
    </p>
  </section>

  <p class="warn" id="warn" hidden></p>
</main>

<dialog id="dlg">
  <form method="dialog" id="form">
    <h3>Новый профиль</h3>
    <label>Имя (до 15 символов: A-Z, 0-9, _ -)
      <input id="fName" maxlength="15" pattern="[A-Za-z0-9_\-]{1,15}" required autocomplete="off">
    </label>
    <label>Конфиг WireGuard
      <textarea id="fConf" rows="10" spellcheck="false" placeholder="[Interface]&#10;PrivateKey = ...&#10;Address = 10.0.0.2/32&#10;&#10;[Peer]&#10;PublicKey = ...&#10;Endpoint = host:51820&#10;AllowedIPs = 0.0.0.0/0" required></textarea>
    </label>
    <input type="file" id="fFile" accept=".conf,text/plain" hidden>
    <p class="err" id="fErr" hidden></p>
    <div class="row">
      <button type="button" class="ghost" id="fPick">Загрузить .conf</button>
      <span class="grow"></span>
      <button type="button" class="ghost" id="fCancel">Отмена</button>
      <button type="submit" class="solid">Сохранить</button>
    </div>
  </form>
</dialog>

<script src="app.js"></script>
</body>
</html>
