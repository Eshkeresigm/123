plugins {
    id 'com.android.application'
}

android {
    namespace 'com.chessvision.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.chessvision.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // produced by `gomobile bind` (see ../README.md and .github/workflows/android.yml)
    implementation files('libs/cvmobile.aar')
}
